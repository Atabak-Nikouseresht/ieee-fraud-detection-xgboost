[project]
name = "ieee-fraud-detection-xgboost"
version = "0.1.0"
description = "Reproducible notebook baseline for IEEE-CIS fraud classification"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
notebook = [
    "ipykernel==7.3.0",
    "notebook==7.6.3",
]

[tool.uv]
package = false
