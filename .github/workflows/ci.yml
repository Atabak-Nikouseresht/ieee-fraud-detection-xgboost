name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-notebook:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.16"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked runtime and notebook dependencies
        run: uv sync --locked --no-dev --extra notebook
      - name: Verify Python and direct dependency versions
        run: uv run --no-sync python scripts/verify_environment.py
      - name: Check installed dependency consistency
        run: uv run --with pip --no-sync python -m pip check
      - name: Test notebook contract and production smoke path
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q fraud_detection.py scripts tests
      - name: Export all locked dependencies for audit
        run: uv export --locked --no-dev --extra notebook --no-emit-project --output-file $RUNNER_TEMP/requirements-audit.txt
      - name: Audit runtime and notebook dependencies
        run: uvx --from pip-audit pip-audit -r $RUNNER_TEMP/requirements-audit.txt
